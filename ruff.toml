line-length = 100
target-version = 'py313'

[lint]
extend-select = ['E501', 'B', 'UP', 'C4', 'RET', 'PIE', 'ISC', 'W', 'SIM', 'I', 'Q', 'PTH']

[lint.isort]
known-first-party = ['core', 'bridge', 'layout', 'app_window', 'presence', 'server', 'watchdog']

[lint.per-file-ignores]
'app/main.py' = ['E402']
