name: release

on:
  push:
    tags: ["v*"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: next/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml
      - name: Build frontend
        run: |
          pnpm -C next install --frozen-lockfile
          pnpm -C next build
      - uses: actions/upload-artifact@v7
        with:
          name: next-out
          path: next/out

  liberator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            src/liberator/target
          key: cargo-liberator-${{ hashFiles('src/liberator/Cargo.lock') }}
          restore-keys: cargo-liberator-
      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build Liberator
        run: sh src/liberator/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: liberator
          path: bin/Liberator.exe

  rvpn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw + upx
        run: sudo apt-get update && sudo apt-get install -y gcc make mingw-w64 upx-ucl
      - name: Build Radmin VPN helpers
        run: sh src/rvpn/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rvpn
          path: bin/rvpn

  linux:
    needs: [frontend, liberator, rvpn]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Pin version to tag
        run: sed -i "s/^VERSION = .*/VERSION = \"${GITHUB_REF_NAME#v}\"/" app/core/constants.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: next-out
          path: next/out
      - uses: actions/download-artifact@v8
        with:
          name: liberator
          path: bin
      - uses: actions/download-artifact@v8
        with:
          name: rvpn
          path: bin/rvpn
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/Nuitka
            ~/.cache/ccache
          key: nuitka-linux-${{ hashFiles('app/requirements.txt') }}
          restore-keys: nuitka-linux-
      - name: Install deps + Nuitka
        run: |
          python -m pip install -r app/requirements.txt nuitka==4.1.3
          sudo apt-get update && sudo apt-get install -y patchelf ccache
      - name: Nuitka build (standalone)
        run: |
          python -m nuitka --standalone --enable-plugin=pyside6 --assume-yes-for-downloads \
            --include-package=core --include-package=bridge \
            --include-data-dir=next/out=next/out \
            --include-data-files=manifest.toml=manifest.toml \
            --include-data-files=.github/icon.png=icon.png \
            --include-data-files=bin/rvpn/*=bin/rvpn/ \
            --include-data-files=bin/Liberator.exe=bin/Liberator.exe \
            --output-filename=Launcher --output-dir=nuitka-out app/main.py
      - name: Package AppImage
        run: |
          dist=$(find nuitka-out -maxdepth 1 -name "*.dist" -type d | head -1)
          appdir=build/AppDir
          mkdir -p "$appdir/usr/bin"
          cp -a "$dist"/. "$appdir/usr/bin/"
          chmod +x "$appdir/usr/bin/bin/rvpn/tap_bridge"
          cp .github/icon.png "$appdir/ThrowbackLauncher.png"
          printf '[Desktop Entry]\nType=Application\nName=Throwback Launcher\nComment=A Rainbow Six Siege launcher for Operation Throwback\nExec=Launcher\nIcon=ThrowbackLauncher\nTerminal=false\nCategories=Game;\nStartupWMClass=ThrowbackLauncher\n' > "$appdir/ThrowbackLauncher.desktop"
          printf '#!/usr/bin/env bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexport QTWEBENGINE_DISABLE_SANDBOX=1\nexec "$HERE/usr/bin/Launcher" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p out
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" out/Launcher.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: out/Launcher.AppImage

  windows:
    needs: [frontend, liberator]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Pin version to tag
        shell: bash
        run: sed -i "s/^VERSION = .*/VERSION = \"${GITHUB_REF_NAME#v}\"/" app/core/constants.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: next-out
          path: next/out
      - uses: actions/download-artifact@v8
        with:
          name: liberator
          path: bin
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-windows-${{ hashFiles('app/requirements.txt') }}
          restore-keys: nuitka-windows-
      - name: Install deps + Nuitka
        run: python -m pip install -r app/requirements.txt nuitka==4.1.3
      - name: Nuitka build app (standalone)
        run: python -m nuitka --standalone --enable-plugin=pyside6 --assume-yes-for-downloads --windows-console-mode=disable --windows-icon-from-ico=.github/icon.ico --include-package=core --include-package=bridge --include-data-dir=next/out=next/out --include-data-files=manifest.toml=manifest.toml --include-data-files=.github/icon.png=icon.png --include-data-files=bin/Liberator.exe=bin/Liberator.exe --output-filename=Launcher.exe --output-dir=app-out app/main.py
      - name: Nuitka build installer (onefile)
        run: python -m nuitka --onefile --enable-plugin=pyside6 --assume-yes-for-downloads --windows-console-mode=disable --windows-icon-from-ico=.github/icon.ico --include-data-dir=app/assets/fonts=assets/fonts --output-filename=Launcher.exe --output-dir=installer-out app/installer.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path app-out/main.dist/* -DestinationPath out/App.zip -Force
          Copy-Item installer-out/Launcher.exe out/Launcher.exe -Force
      - name: Verify App.zip layout
        run: >
          python -c "import zipfile; names = zipfile.ZipFile('out/App.zip').namelist();
          assert 'Launcher.exe' in names, names[:3]"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            out/Launcher.exe
            out/App.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{appimage,windows}"
      - name: Create draft release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${{ github.repository }}" --draft --title "$tag" --notes ""
          gh release upload "$tag" \
            "artifacts/appimage/Launcher.AppImage" \
            "artifacts/windows/Launcher.exe" \
            "artifacts/windows/App.zip" \
            --clobber --repo "${{ github.repository }}"
